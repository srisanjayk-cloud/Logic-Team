<!doctype html>
<html>
  <head>
    <title>Logic Team</title>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        font-family: "DM Sans", sans-serif;
        background: #0f0f1a;
        color: white;
      }

      /* Top Navbar */
      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
        background: #0f0f1a;
        border-bottom: 1px solid #1f2937;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .logo {
        font-family: "DM Serif Display", serif;
        font-size: 24px;
      }

      .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
      }

      .nav-links a {
        color: #9ca3af;
        text-decoration: none;
        font-size: 14px;
      }

      .nav-links a:hover {
        color: white;
      }

      /* Buttons */
      .btn {
        padding: 8px 14px;
        border-radius: 8px;
        text-decoration: none;
        font-size: 13px;
      }

      .login {
        background: #111827;
        color: #9ca3af;
      }

      .signup {
        background: #6366f1;
        color: white;
      }

      /* Main container */
      .maincontainer {
        max-width: 900px;
        margin: 40px auto;
        padding: 0 20px;
      }

      /* Center content wrapper (e.g., event form) */
      .form-wrapper {
        width: 100%;
        max-width: 620px;
        margin: 0 auto;
      }
    </style>
  </head>

  <body>
    <!-- Top Navbar -->
    <div class="navbar">
      <div class="logo">Logic Team</div>

      <div class="nav-links">
        <a href="/">Home</a>
        <a href="/events/">Events</a>
        <a href="/projects/">Projects</a>

        {% if user.is_authenticated %}
        <span>Hi, {{ user.username }}</span>
        <a href="/logout/" class="btn login">Logout</a>
        {% else %}
        <a href="/login/" class="btn login">Login</a>
        <a href="/register/" class="btn signup">Sign up</a>
        {% endif %}
      </div>
    </div>

    <!-- Main Content -->
    <div class="maincontainer">
      <div class="form-wrapper">{% block content %}{% endblock %}</div>
    </div>
  </body>
</html>
