<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Register</title>

    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "DM Sans", sans-serif;
        background: #0f0f1a;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .container {
        display: flex;
        width: 850px;
        border-radius: 16px;
        overflow: hidden;
        background: #111827;
      }

      /* LEFT PANEL */
      .left {
        width: 45%;
        background: #0f0f1a;
        padding: 40px;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      .brand {
        font-size: 14px;
        letter-spacing: 2px;
      }

      .left h2 {
        font-family: "DM Serif Display", serif;
        font-size: 28px;
        margin: 20px 0;
      }

      .left p {
        font-size: 14px;
        color: #9ca3af;
      }

      /* RIGHT PANEL */
      .right {
        flex: 1;
        background: #1f2937;
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      .right h3 {
        font-family: "DM Serif Display", serif;
        font-size: 24px;
        margin-bottom: 10px;
        color: white;
      }

      .sub {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 20px;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: 1px solid #374151;
        background: #111827;
        color: white;
        outline: none;
      }

      input:focus {
        border-color: #6366f1;
      }

      .row {
        display: flex;
        gap: 10px;
      }

      button {
        width: 100%;
        padding: 12px;
        background: #6366f1;
        border: none;
        border-radius: 8px;
        color: white;
        font-weight: 500;
        cursor: pointer;
        transition: 0.2s;
      }

      button:hover {
        background: #4f46e5;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 10px;
        font-size: 13px;
      }

      .footer {
        margin-top: 15px;
        font-size: 13px;
        color: #9ca3af;
      }

      .footer a {
        color: #6366f1;
        text-decoration: none;
      }
      .oauth {
        margin-bottom: 20px;
        margin-top: 10px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <!-- LEFT -->
      <div class="left">
        <div class="brand">● Logic Team</div>

        <div>
          <h2>Create your<br />workspace.</h2>
          <p>Start building something amazing today.</p>
        </div>

        <p style="font-size: 12px">"Setup takes less than 2 minutes."</p>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <h3>Create account</h3>
        <p class="sub">Join and get started</p>

        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST">
          {% csrf_token %}

          <div class="row">
            <input
              type="text"
              name="first_name"
              placeholder="First name"
              required
            />
            <input
              type="text"
              name="last_name"
              placeholder="Last name"
              required
            />
          </div>

          <input type="text" name="username" placeholder="Username" required />
          <input
            type="password"
            name="password"
            placeholder="Password"
            required
          />
          <input
            type="password"
            name="confirm"
            placeholder="Confirm Password"
            required
          />

          <button type="submit">Create account</button>
        </form>

        <div class="footer">
          Already have an account? <a href="/login/">Sign in</a>
        </div>

        <div class="oauth">
          <a href="/accounts/google/login/" style="text-decoration: none">
            <button
              style="
                width: 100%;
                padding: 12px;
                background: white;
                color: #111;
                border-radius: 8px;
                border: 1px solid #e5e7eb;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
                cursor: pointer;
                font-weight: 500;
              "
            >
              <!-- Google Icon -->
              <img
                src="https://www.svgrepo.com/show/475656/google-color.svg"
                width="18"
                height="18"
              />

              Continue with Google
            </button>
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
